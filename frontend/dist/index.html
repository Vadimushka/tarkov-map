<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Tarkov Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="ribbon">
  <nav class="tabs" role="tablist" title="Двойной щелчок по вкладке — свернуть или развернуть ленту">
    <button class="tab" role="tab" data-tab="main">Главная</button>
    <button class="tab" role="tab" data-tab="loot">Лут и места</button>
    <button class="tab" role="tab" data-tab="settings">Настройки</button>
    <span class="spacer"></span>
    <select id="map-pick" title="Какую карту показывать. Ручной выбор действует, пока игра не загрузит следующую карту">
      <option value="">Карта как в игре</option>
    </select>
    <button id="collapse" class="tab" title="Свернуть ленту">˄</button>
  </nav>

  <div class="pane" data-pane="main">
    <section class="group">
      <div class="items side" role="radiogroup" aria-label="Сторона">
        <label><input type="radio" name="side" value="pmc">ЧВК</label>
        <label><input type="radio" name="side" value="scav">Дикий</label>
      </div>
      <div class="caption">Сторона</div>
    </section>
    <section class="group">
      <div class="items grid">
        <label><input type="checkbox" data-f="position"><span class="sw" style="background:var(--route)"></span>Где я сейчас</label>
        <label><input type="checkbox" data-f="trail"><span class="sw trail"></span>Пройденный путь</label>
        <label><input type="checkbox" data-f="transit"><span class="sw" style="background:var(--transit)"></span>Переходы</label>
        <label><input type="checkbox" data-f="extract_own"><span class="sw" data-own></span>Мои выходы</label>
        <label><input type="checkbox" data-f="extract_shared"><span class="sw" style="background:var(--shared)"></span>Совместные выходы</label>
        <label><input type="checkbox" data-f="extract_other"><span class="sw" data-other></span>Выходы другой стороны</label>
        <label title="Выключите — останутся значки, название покажется при наведении"><input type="checkbox" data-f="labels"><span class="sw txt">Аа</span>Подписи</label>
      </div>
      <div class="caption">Показывать</div>
    </section>
    <section class="group" id="floors-group" hidden>
      <div class="items grid" id="floors"></div>
      <div class="caption">Этаж</div>
    </section>
    <section class="group">
      <div class="items col">
        <label title="Новый скрин всегда в кадре, даже если карту сдвинули или приблизили. Чтобы спокойно рассматривать карту, снимите флажок."><input type="checkbox" id="follow" checked>Следовать за мной</label>
        <div class="row">
          <button id="center" disabled>Центр на мне</button>
          <button id="fit" disabled>Вся карта</button>
        </div>
      </div>
      <div class="caption">Вид</div>
    </section>
  </div>

  <div class="pane" data-pane="loot">
    <section class="group">
      <div class="items col">
        <label><input type="checkbox" data-f="places"><span class="sw txt">Аа</span>Названия мест</label>
      </div>
      <div class="caption">Места</div>
    </section>
    <section class="group">
      <div class="items grid rows4">
        <label><input type="checkbox" data-f="c_weapon"><img class="ico" src="icons/container_weapon-box.png" alt="">Оружейные<span class="n" data-n="c_weapon"></span></label>
        <label><input type="checkbox" data-f="c_med"><img class="ico" src="icons/container_medbag.png" alt="">Медицина<span class="n" data-n="c_med"></span></label>
        <label><input type="checkbox" data-f="c_tech"><img class="ico" src="icons/container_toolbox.png" alt="">Техника<span class="n" data-n="c_tech"></span></label>
        <label><input type="checkbox" data-f="c_safe"><img class="ico" src="icons/container_safe.png" alt="">Сейфы и кассы<span class="n" data-n="c_safe"></span></label>
        <label><input type="checkbox" data-f="c_cache"><img class="ico" src="icons/container_buried-barrel-cache.png" alt="">Тайники<span class="n" data-n="c_cache"></span></label>
        <label><input type="checkbox" data-f="c_body"><img class="ico" src="icons/container_dead-scav.png" alt="">Тела<span class="n" data-n="c_body"></span></label>
        <label><input type="checkbox" data-f="c_misc"><img class="ico" src="icons/container_duffle-bag.png" alt="">Сумки и прочее<span class="n" data-n="c_misc"></span></label>
      </div>
      <div class="caption">Контейнеры</div>
    </section>
    <section class="group">
      <div class="items col loot">
        <div class="row">
          <input id="loot-q" type="search" placeholder="Флешка, Ледокол…" title="Ищет только лут на земле; содержимое контейнеров неизвестно" spellcheck="false">
          <button id="loot-clear" title="Очистить">×</button>
        </div>
        <label><input type="checkbox" data-f="loot_all"><img class="ico" src="icons/loose_loot.png" alt="">Все точки<span class="n" data-n="loot_all"></span></label>
        <span id="loot-found" class="muted"></span>
      </div>
      <div class="caption">Лут на земле</div>
    </section>
    <section class="group">
      <div class="items grid">
        <label><input type="checkbox" data-f="locks"><img class="ico" src="icons/lock.png" alt="">Замки<span class="n" data-n="locks"></span></label>
        <label><input type="checkbox" data-f="switches"><img class="ico" src="icons/switch.png" alt="">Рубильники<span class="n" data-n="switches"></span></label>
        <label><input type="checkbox" data-f="hazards"><img class="ico" src="icons/hazard.png" alt="">Опасные зоны<span class="n" data-n="hazards"></span></label>
        <label><input type="checkbox" data-f="weapons"><img class="ico" src="icons/stationarygun.png" alt="">Пулемёты<span class="n" data-n="weapons"></span></label>
        <label><input type="checkbox" data-f="bosses"><img class="ico" src="icons/spawn_boss.png" alt="">Боссы<span class="n" data-n="bosses"></span></label>
      </div>
      <div class="caption">Прочее</div>
    </section>
  </div>

  <div class="pane" data-pane="settings">
    <section class="group">
      <div class="items paths">
        <label>Игра (папка с Logs)<input id="game-dir" spellcheck="false"></label>
        <label>Скриншоты<input id="shots-dir" spellcheck="false"></label>
        <button id="save-paths">Сохранить</button>
      </div>
      <div class="caption">Пути — пустое поле значит «искать автоматически»</div>
    </section>
    <section class="group">
      <div class="items col">
        <span id="data-date" class="muted"></span>
        <span class="muted" title="Новые данные придут с новой версией программы">Встроены в программу</span>
        <span id="settings-result" class="muted"></span>
      </div>
      <div class="caption">Данные</div>
    </section>
    <section class="group">
      <div class="items col about">
        <span id="version">Tarkov Map</span>
        <span>Карты: the-hideout / tarkov.dev, CC BY-NC-SA 4.0.</span>
        <span>Данные: tarkov.dev</span>
        <span>Значки: the-hideout / tarkov.dev, MIT.</span>
      </div>
      <div class="caption">О программе</div>
    </section>
  </div>
</header>

<main id="view">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="msg" hidden></div>
</main>

<footer id="status"></footer>
<div id="tip"></div>

<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
