<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Tarkov Map</title>
<style>
  html, body { margin: 0; height: 100%; background: #14130f; color: #d8d2c0; font: 16px system-ui, sans-serif; }
  #out { display: flex; height: 100%; align-items: center; justify-content: center; font-size: 64px; }
</style>
</head>
<body>
<div id="out">…</div>
<script>
  window.addEventListener("load", async () => {
    const out = document.getElementById("out");
    try {
      out.textContent = await window.go.main.App.Ping();
    } catch (e) {
      out.textContent = "ошибка: " + e;
    }
  });
</script>
</body>
</html>
